server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # The Cesium chunk is ~4 MB minified; text assets compress to roughly a quarter.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml text/xml;
  # A location with its own add_header drops the server-level ones, so every
  # location that adds headers includes the security headers again.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 65s;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
  location /cesium/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}

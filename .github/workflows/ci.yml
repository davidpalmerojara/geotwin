name: Verify GeoTwin Cloud
on: [push, pull_request]
# Read-only token; a newer push to the same branch cancels the run in progress.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_USER: geotwin, POSTGRES_PASSWORD: geotwin_local, POSTGRES_DB: geotwin }
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U geotwin -d geotwin"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Worker tests: real py3dtiles conversions, the official geoid grid and a MinIO server.
      LIDAR_PYTHON: python
      REQUIRE_LIDAR_TESTS: 'true'
      GEOID_GRID_DIR: ${{ github.workspace }}/.geoid
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY_ID: geotwin
      S3_TEST_SECRET_ACCESS_KEY: geotwin_local_minio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/worker/python/requirements*.txt
      - run: pip install -r apps/worker/python/requirements-dev.txt
      - name: Official EGM08-REDNAP geoid grid (IGN, CC-BY 4.0) for the exact-path tests
        run: |
          mkdir -p .geoid
          curl -fsSL --retry 3 -o .geoid/es_ign_egm08-rednap.tif https://cdn.proj.org/es_ign_egm08-rednap.tif
      - name: MinIO for the S3 driver test
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=geotwin -e MINIO_ROOT_PASSWORD=geotwin_local_minio \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
      - run: npm ci
      - run: npm run build -w @geotwin/shared -w @geotwin/storage
      - run: npm run lint && npm run format:check && npm run typecheck && npm test
      - name: Python tests (inspect, conversion, vertical datum)
        run: python -m pytest -q apps/worker/python/tests
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results/ }
      - run: docker logs minio
        if: failure()
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl --fail http://localhost:8080/api/health && curl --fail http://localhost:8080
      - name: Upload the synthetic LAZ through nginx → API → MinIO → worker → 3D Tiles
        run: scripts/smoke-layer.sh http://localhost:8080
      - run: docker compose logs && docker compose down
        if: always()
